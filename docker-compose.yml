# Dev-окружение (R96i): API, воркер, фронтенд. БД dev — SQLite внутри контейнера api.
# Prod-профиль (PostGIS, Redis, reverse proxy) — docker-compose.prod.yml (R85).

# Каталог загрузок админского импорта CSV — единственная настройка файлового
# источника: адаптер network_import сам читает из него <каталог>/catalog-enrichment.csv
# (отдельного пути к файлу нет). Общая переменная для api и worker: админка
# (процесс api) пишет загрузку, воркер — отдельный контейнер с другой ФС —
# читает её с общего тома fuelradar-data (→ /data).
x-import-files: &import-files
  FUELRADAR_CSV_UPLOAD_DIR: ${FUELRADAR_CSV_UPLOAD_DIR:-/data/import}

services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/fuelradar.db
      DEBUG: ${DEBUG:-true}
      ADMIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_RATE_LIMIT_PER_MINUTE:-30}
      JWT_SECRET: ${JWT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@localhost}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      DEFAULT_REGION_CITY: ${DEFAULT_REGION_CITY:-Краснодар}
      # Файловый источник (T02): api пишет сюда загрузку из админки.
      <<: *import-files
    volumes:
      - fuelradar-data:/data

  worker:
    build: ./backend
    command: python -m app.worker
    depends_on:
      - api
    environment:
      DATABASE_URL: sqlite:////data/fuelradar.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      DEFAULT_REGION_CITY: ${DEFAULT_REGION_CITY:-Краснодар}
      # Файловый источник (T02): воркер читает загрузку админки из того же каталога,
      # который задан api (общий том, см. x-import-files). Инвариант проверяет
      # tests/test_compose_config.py.
      <<: *import-files
      # HTTP-списки сетей: пусто → источник network_lists отвечает «не настроено»
      # и не выполняет сеть; задаётся в .env, активация источника — в админке.
      NETWORK_LISTS_URLS: ${NETWORK_LISTS_URLS:-}
    volumes:
      - fuelradar-data:/data

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"

volumes:
  fuelradar-data:
