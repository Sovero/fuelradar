# Dev-окружение (R96i): API, воркер, фронтенд. БД dev — SQLite внутри контейнера api.
# Prod-профиль (PostGIS, Redis, reverse proxy) — docker-compose.prod.yml (R85).
services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/fuelradar.db
      DEFAULT_REGION_CITY: ${DEFAULT_REGION_CITY:-Краснодар}
    volumes:
      - fuelradar-data:/data

  worker:
    build: ./backend
    command: python -m app.worker
    depends_on:
      - api
    environment:
      DATABASE_URL: sqlite:////data/fuelradar.db
      DEFAULT_REGION_CITY: ${DEFAULT_REGION_CITY:-Краснодар}
    volumes:
      - fuelradar-data:/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

volumes:
  fuelradar-data: