# Prod-профиль (R85): PostGIS, Redis, reverse proxy. Поверх docker-compose.yml.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fuelradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: fuelradar
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelradar"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://fuelradar:${POSTGRES_PASSWORD}@db:5432/fuelradar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    environment:
      DATABASE_URL: postgresql+psycopg://fuelradar:${POSTGRES_PASSWORD}@db:5432/fuelradar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - frontend
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  postgis-data:
  caddy-data: